get_board:
  fields:
    uic:
      example: "87757526"
      selector:
        text:
    direction:
      default: departures
      selector:
        select:
          translation_key: direction
          options:
            - departures
            - arrivals
    rows:
      selector:
        number:
          min: 1
          max: 60
    horizon_hours:
      selector:
        number:
          min: 1
          max: 48
          unit_of_measurement: h
    hide_minor_messages:
      selector:
        boolean:

search_stations:
  fields:
    query:
      required: true
      example: saint raph
      selector:
        text:
    limit:
      default: 15
      selector:
        number:
          min: 1
          max: 50

refresh:
  fields:
    what:
      default: realtime
      selector:
        select:
          translation_key: refresh_what
          options:
            - realtime
            - timetable
            - reference
            - all
